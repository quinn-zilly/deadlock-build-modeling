<meta charset="utf-8">
<title>Deadlock Build Orders</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ground:#E8E1D3; --surface:#F2EDE2; --raised:#FBF8F1;
  --edge:#D2C7B2; --edge-soft:#E0D8C7;
  --text:#1E1A15; --muted:#655C50; --faint:#8B8073;
  --brass:#8A5F1E; --brass-bright:#B8863B;
  --good:#4A6B3D; --warn:#8A6A1F;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ground:#12100E; --surface:#191612; --raised:#221D18;
    --edge:#342D25; --edge-soft:#2A241E;
    --text:#EDE6D9; --muted:#A79B8A; --faint:#7C7264;
    --brass:#C9973F; --brass-bright:#E0B15C;
    --good:#8FB37A; --warn:#C9A24A;
  }
}
:root[data-theme="dark"]{
  --ground:#12100E; --surface:#191612; --raised:#221D18;
  --edge:#342D25; --edge-soft:#2A241E;
  --text:#EDE6D9; --muted:#A79B8A; --faint:#7C7264;
  --brass:#C9973F; --brass-bright:#E0B15C;
  --good:#8FB37A; --warn:#C9A24A;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--ground); color:var(--text);
  font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.55;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 24px 64px}

header.top{border-bottom:1px solid var(--edge);margin-bottom:28px;background:var(--surface)}
.masthead{display:flex;flex-wrap:wrap;align-items:flex-end;gap:22px 36px;padding:38px 0 22px}
h1{
  font-family:Cinzel,Georgia,serif; font-weight:700; letter-spacing:.02em;
  font-size:clamp(30px,4.2vw,44px); line-height:1.06; margin:0; text-wrap:balance;
}
h1 .sub{display:block;font-family:"IBM Plex Sans",sans-serif;font-weight:500;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--brass);
  margin-bottom:11px}
.lede{margin:12px 0 0;color:var(--muted);max-width:60ch}
.facts{display:flex;gap:28px;margin-left:auto;flex-wrap:wrap}
.fact{display:flex;flex-direction:column;gap:1px}
.fact b{font-family:"IBM Plex Mono",monospace;font-size:23px;font-weight:500;
  font-variant-numeric:tabular-nums;color:var(--brass);line-height:1.2}
.fact span{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}

.cols{display:grid;grid-template-columns:264px 1fr;gap:36px;align-items:start}
@media(max-width:880px){.cols{grid-template-columns:1fr}}

.rail{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow-y:auto;
  border:1px solid var(--edge);background:var(--surface);border-radius:2px}
@media(max-width:880px){.rail{position:static;max-height:320px}}
.search{width:100%;border:0;border-bottom:1px solid var(--edge);background:transparent;
  color:var(--text);padding:12px 14px;font:inherit;font-size:14px}
.search::placeholder{color:var(--faint)}
.search:focus{outline:2px solid var(--brass);outline-offset:-2px}
.railgroup{border-bottom:1px solid var(--edge-soft)}
.railgroup:last-child{border-bottom:0}
.railhero{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:11.5px;letter-spacing:.11em;
  text-transform:uppercase;color:var(--faint);padding:12px 14px 3px}
.pick{display:flex;align-items:baseline;gap:8px;width:100%;text-align:left;border:0;
  background:transparent;color:var(--text);font:inherit;font-size:14px;padding:6px 14px 8px;
  cursor:pointer;border-left:3px solid transparent}
.pick:hover{background:var(--raised)}
.pick:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.pick[aria-current="true"]{border-left-color:var(--brass);background:var(--raised);font-weight:600}
.pick .sh{margin-left:auto;font-family:"IBM Plex Mono",monospace;font-size:11px;
  color:var(--faint);font-variant-numeric:tabular-nums}

.buildhead{display:flex;flex-wrap:wrap;gap:14px 26px;align-items:flex-end;
  padding-bottom:14px;border-bottom:2px solid var(--brass)}
h2{font-family:Cinzel,Georgia,serif;font-weight:700;font-size:29px;margin:0;line-height:1.1;
  text-wrap:balance}
.stat{display:flex;flex-direction:column}
.stat b{font-family:"IBM Plex Mono",monospace;font-size:15px;font-weight:500;
  font-variant-numeric:tabular-nums}
.stat span{font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint)}
.gate{margin-left:auto;display:inline-flex;align-items:center;gap:7px;font-size:12.5px;
  color:var(--good)}
.gate::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--good);flex:none}

.legend{display:flex;flex-wrap:wrap;gap:8px 20px;padding:13px 0 16px;font-size:12px;
  color:var(--muted)}
.legend i{font-style:normal;display:inline-flex;align-items:center;gap:6px}
.key{width:9px;height:9px;border-radius:50%;background:var(--brass);display:inline-block;flex:none}
.key.plain{background:var(--edge)}

.rows{position:relative;padding-left:72px}
.rows::before{content:"";position:absolute;left:72px;top:8px;bottom:8px;width:1px;
  background:var(--edge)}
.row{position:relative;display:grid;grid-template-columns:1fr auto;gap:3px 18px;
  padding:11px 0 12px;border-bottom:1px solid var(--edge-soft)}
.row:last-child{border-bottom:0}
.clock{position:absolute;left:-72px;top:12px;width:50px;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums}
.dot{position:absolute;left:-4.5px;top:17px;width:9px;height:9px;border-radius:50%;
  background:var(--edge);border:2px solid var(--ground)}
.row.staple .dot{background:var(--brass)}
.name{font-weight:500;display:flex;align-items:baseline;gap:9px;flex-wrap:wrap}
.tag{font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;padding:1px 6px;
  border-radius:2px;white-space:nowrap}
.tag.staple{color:var(--brass);border:1px solid var(--brass)}
.tag.sold{color:var(--faint);border:1px solid var(--edge)}
.tag.thin{color:var(--warn);border:1px solid var(--warn)}
.meta{grid-column:1;font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.cost{grid-row:1/3;grid-column:2;text-align:right;font-family:"IBM Plex Mono",monospace;
  font-size:13px;font-variant-numeric:tabular-nums;color:var(--muted);align-self:center;
  min-width:92px}
.bar{display:block;height:3px;background:var(--brass);opacity:.45;margin:5px 0 0 auto;
  border-radius:2px}

h3.section{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:15px;
  letter-spacing:.04em;margin:34px 0 4px;padding-bottom:7px;
  border-bottom:1px solid var(--edge)}
.section-note{font-size:12px;color:var(--muted);margin:0 0 12px}
.priority{font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--text);
  margin:0 0 14px}
.points{display:grid;grid-template-columns:repeat(auto-fill,minmax(206px,1fr));gap:8px}
.point{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:8px 11px;
  border:1px solid var(--edge-soft);border-radius:3px;background:var(--raised)}
.point .ord{grid-row:1/3;align-self:center;font-family:"IBM Plex Mono",monospace;
  font-size:15px;color:var(--brass);font-variant-numeric:tabular-nums}
.point .who{font-weight:500;font-size:13.5px}
.point .ev{font-family:"IBM Plex Mono",monospace;font-size:11px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.point.thin{border-color:var(--warn)}
.pairs{display:grid;gap:8px;margin:0}
.pair{display:grid;grid-template-columns:1fr auto;gap:2px 18px;padding:9px 0;
  border-bottom:1px solid var(--edge-soft)}
.pair:last-child{border-bottom:0}
.pair .lead{font-weight:500}
.pair .ev{grid-column:1;font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  color:var(--faint);font-variant-numeric:tabular-nums}
.pair .figure{grid-row:1/3;grid-column:2;align-self:center;text-align:right;
  font-family:"IBM Plex Mono",monospace;font-size:13px;color:var(--muted);
  font-variant-numeric:tabular-nums;min-width:92px}
.empty{font-size:12.5px;color:var(--faint);margin:0 0 4px}

/* Export. One action, so it is a single button rather than a card of them. */
.export{display:flex;flex-wrap:wrap;align-items:center;gap:14px 18px;margin:0 0 6px}
.btn{font:inherit;font-size:13.5px;font-weight:500;color:var(--ground);
  background:var(--brass);border:1px solid var(--brass);border-radius:2px;
  padding:8px 16px;cursor:pointer}
.btn:hover{background:var(--brass-bright);border-color:var(--brass-bright)}
.btn:focus-visible{outline:2px solid var(--text);outline-offset:2px}
.lost{font-size:12px;color:var(--muted);max-width:52ch}
.lost b{font-weight:600;color:var(--warn)}

/* Comparison. Two builds, so two columns that collapse to one when narrow. */
.vs{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;align-items:start}
@media(max-width:700px){.vs{grid-template-columns:1fr;gap:18px}}
.vs h4{font-family:Cinzel,Georgia,serif;font-weight:500;font-size:14px;margin:0 0 2px;
  padding-bottom:6px;border-bottom:1px solid var(--edge-soft)}
.vs .side{min-width:0}
.vs ol{list-style:none;margin:0;padding:0}
.vs li{display:grid;grid-template-columns:auto 1fr auto;gap:9px;padding:5px 0;
  font-size:13px;border-bottom:1px solid var(--edge-soft)}
.vs li:last-child{border-bottom:0}
.vs .ord{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  font-variant-numeric:tabular-nums}
.vs .when{font-family:"IBM Plex Mono",monospace;font-size:11.5px;color:var(--faint);
  font-variant-numeric:tabular-nums;text-align:right}
.vs li.only{background:var(--raised)}
.vs li.only .what{color:var(--brass);font-weight:500}
.shared{display:flex;flex-wrap:wrap;gap:6px 8px;margin:10px 0 0;padding:0;list-style:none}
.shared li{font-size:12px;color:var(--muted);border:1px solid var(--edge-soft);
  border-radius:2px;padding:2px 8px}
.pickvs{font:inherit;font-size:13px;color:var(--text);background:var(--raised);
  border:1px solid var(--edge);border-radius:2px;padding:5px 9px}
.pickvs:focus-visible{outline:2px solid var(--brass);outline-offset:-2px}
.vshead{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;margin:0 0 12px}

footer{margin-top:40px;padding-top:18px;border-top:1px solid var(--edge);
  color:var(--faint);font-size:12.5px;max-width:74ch}
@media(prefers-reduced-motion:no-preference){
  .row{animation:in .2s ease-out both}
}
@keyframes in{from{opacity:.6}to{opacity:1}}
</style>

<header class="top"><div class="wrap"><div class="masthead">
  <div>
    <h1><span class="sub">Deadlock &middot; imitation model</span>Build Orders</h1>
    <p class="lede">What players actually buy, and <em>when</em>. Every purchase carries the
    evidence behind it &mdash; how many matches back it, and how specific that evidence was.</p>
  </div>
  <div class="facts" id="facts"></div>
</div></div></header>

<div class="wrap"><div class="cols">
  <nav class="rail" aria-label="Builds">
    <input class="search" id="q" type="search" placeholder="Filter heroes&hellip;" aria-label="Filter heroes">
    <div id="list"></div>
  </nav>
  <main id="panel"></main>
</div>

<footer id="footer"></footer>
</div>

<script>
const clock = s => Math.floor(s / 60) + ":" + String(Math.round(s) % 60).padStart(2, "0");
const list = document.getElementById("list");
const panel = document.getElementById("panel");
let current = 0;
// The build being compared against, or null for none. Cleared whenever the
// selection moves to another hero, since a comparison across heroes would be
// two different games rather than two ways of playing one.
let other = null;

const byHero = {};
BUILDS.forEach((b, i) => { (byHero[b.hero] = byHero[b.hero] || []).push(Object.assign({ i: i }, b)); });

function renderList(filter) {
  const f = (filter || "").trim().toLowerCase();
  list.replaceChildren();
  Object.keys(byHero).sort().forEach(hero => {
    const rows = byHero[hero].filter(b =>
      !f || hero.toLowerCase().includes(f) || b.archetype.toLowerCase().includes(f));
    if (!rows.length) return;
    const g = document.createElement("div");
    g.className = "railgroup";
    const h = document.createElement("div");
    h.className = "railhero";
    h.textContent = hero;
    g.appendChild(h);
    rows.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "pick";
      btn.type = "button";
      btn.setAttribute("aria-current", b.i === current ? "true" : "false");
      const label = document.createElement("span");
      label.textContent = b.archetype === hero ? "single build" : b.archetype;
      const share = document.createElement("span");
      share.className = "sh";
      share.textContent = Math.round((b.share || 0) * 100) + "%";
      btn.append(label, share);
      btn.onclick = () => {
        // A build never compares against itself, and a comparison never
        // crosses heroes -- two heroes' builds differ for reasons that have
        // nothing to do with playstyle.
        if (BUILDS[b.i].hero !== BUILDS[current].hero || b.i === other) other = null;
        current = b.i;
        renderList(f);
        renderBuild();
      };
      g.appendChild(btn);
    });
    list.appendChild(g);
  });
}

function renderBuild() {
  const b = BUILDS[current];
  const total = b.items.reduce((s, i) => s + i.cost, 0);
  const held = b.items.filter(i => !i.sold).length;
  const win = b.win_rate ? (b.win_rate * 100).toFixed(1) + "%" : "—";

  panel.innerHTML =
    '<div class="buildhead">' +
      "<h2>" + (b.archetype === b.hero ? b.hero : b.archetype) + "</h2>" +
      stat((b.n || 0).toLocaleString(), "players") +
      stat(win, "win rate") +
      stat(b.items.length, "purchases") +
      stat(held, "held") +
      stat(total.toLocaleString(), "souls") +
      '<div class="gate">' + b.n_staples + " staples, all present</div>" +
    "</div>" +
    '<div class="legend">' +
      '<i><span class="key"></span> bought by 70% or more of these players</i>' +
      '<i><span class="key plain"></span> the model&rsquo;s own pick</i>' +
      "<i>n = matches behind the pick &middot; L0&ndash;L5 = how specific the evidence was</i>" +
    "</div>" +
    '<div class="rows">' + b.items.map(renderRow).join("") + "</div>" +
    renderAbilities(b) + renderImbue(b) + renderCounters(b) +
    renderCompare(b) + renderExport(b);

  // Rebuilding the panel's HTML throws away the previous listeners with the
  // nodes they were on, so both controls are rebound on every render.
  const dl = document.getElementById("dl");
  if (dl) dl.onclick = () => downloadBuild(BUILDS[current]);
  const vs = document.getElementById("vs");
  if (vs) vs.onchange = e => {
    other = e.target.value === "" ? null : Number(e.target.value);
    renderBuild();
  };
}

const esc = t => String(t).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

function priority(points) {
  // What a player reads at a glance: the order the abilities are maxed in.
  const seen = [];
  points.forEach(p => { if (p.level === 4 && !seen.includes(p.name)) seen.push(p.name); });
  points.forEach(p => { if (!seen.includes(p.name)) seen.push(p.name); });
  return seen.map(esc).join(" &rsaquo; ");
}

function renderAbilities(b) {
  const points = b.abilities || [];
  if (!points.length) return "";
  return '<h3 class="section">Ability order</h3>' +
    '<p class="section-note">Every point in order. Times are the population median &mdash; ' +
    "you level when you level up, not by the clock.</p>" +
    '<p class="priority">' + priority(points) + "</p>" +
    '<div class="points">' + points.map(p =>
      '<div class="point' + (p.thin ? " thin" : "") + '">' +
        '<span class="ord">' + p.position + "</span>" +
        '<span class="who">' + esc(p.name) + " &rarr; " + p.level + "</span>" +
        '<span class="ev">' + clock(p.time) + " &middot; p=" + p.p.toFixed(2) +
          " &middot; n=" + p.n.toLocaleString() + (p.thin ? " &middot; thin" : "") + "</span>" +
      "</div>").join("") + "</div>";
}

function renderImbue(b) {
  const rows = b.imbue || [];
  if (!rows.length) return "";
  return '<h3 class="section">What to imbue</h3>' +
    '<p class="section-note">An imbueable item aimed at the wrong ability is the ' +
    "whole purchase wasted, so the target is half the advice.</p>" +
    '<div class="pairs">' + rows.map(r =>
      '<div class="pair">' +
        '<span class="lead">' + esc(r.item) + " &rarr; " + esc(r.ability) +
          (r.thin ? '<span class="tag thin"> thin evidence</span>' : "") +
          (r.split && !r.thin ? '<span class="tag thin"> split</span>' : "") + "</span>" +
        '<span class="ev">n=' + r.n.toLocaleString() + " imbues</span>" +
        '<span class="figure">' + Math.round(r.share * 100) + "%</span>" +
      "</div>").join("") + "</div>";
}

function renderCounters(b) {
  const rows = b.counters || [];
  if (!rows.length) return "";
  return '<h3 class="section">Counter-picks</h3>' +
    '<p class="section-note">How much facing a hero moves the pick rate of an item ' +
    "this build already buys. A matchup effect, not a reordering.</p>" +
    '<div class="pairs">' + rows.map(r =>
      '<div class="pair">' +
        '<span class="lead">' + esc(r.item) + " vs " + esc(r.enemy) + "</span>" +
        '<span class="ev">' + (r.facing * 100).toFixed(1) + "% facing vs " +
          (r.baseline * 100).toFixed(1) + "% not &middot; n=" + r.n.toLocaleString() + "</span>" +
        '<span class="figure">+' + (r.lift * 100).toFixed(1) + "pp</span>" +
      "</div>").join("") + "</div>";
}

// Comparison. A hero with two or three archetypes raises exactly one question
// -- what is actually different -- and answering it by reading two lists in
// turn is what the page is for. Items unique to a side are marked, because two
// builds of one hero share most of their purchases and the difference is the
// short list, not the long one.
function renderCompare(b) {
  const siblings = (byHero[b.hero] || []).filter(s => s.i !== current);
  if (!siblings.length) return "";

  const options = siblings.map(s =>
    '<option value="' + s.i + '"' + (s.i === other ? " selected" : "") + ">" +
      esc(s.archetype === b.hero ? "single build" : s.archetype) + "</option>").join("");
  const head = '<h3 class="section">Side by side</h3>' +
    '<div class="vshead"><label for="vs">Compare with</label>' +
    '<select class="pickvs" id="vs">' +
      '<option value="">' + (other === null ? "choose a build" : "none") + "</option>" +
      options + "</select></div>";

  if (other === null || !BUILDS[other]) return head +
    '<p class="empty">' + b.hero + " has " + (siblings.length + 1) +
    " builds. Pick one to see what this build buys that it does not.</p>";

  const o = BUILDS[other];
  const mine = new Set(b.items.map(i => i.id));
  const theirs = new Set(o.items.map(i => i.id));
  const shared = b.items.filter(i => theirs.has(i.id));

  const side = (build, against) =>
    '<div class="side"><h4>' + esc(build.archetype === build.hero
      ? build.hero : build.archetype) + "</h4><ol>" +
    build.items.map((i, n) =>
      '<li class="' + (against.has(i.id) ? "" : "only") + '">' +
        '<span class="ord">' + (n + 1) + "</span>" +
        '<span class="what">' + esc(i.name) + "</span>" +
        '<span class="when">' + clock(i.time) + "</span></li>").join("") +
    "</ol></div>";

  return head +
    '<p class="section-note">Highlighted purchases belong to one build only. ' +
    "The " + shared.length + " both buy are listed underneath.</p>" +
    '<div class="vs">' + side(b, theirs) + side(o, mine) + "</div>" +
    (shared.length
      ? '<ul class="shared">' + shared.map(i =>
          "<li>" + esc(i.name) + "</li>").join("") + "</ul>"
      : '<p class="empty">These two builds share no purchases at all.</p>');
}

// The in-game build browser imports held items only: its schema has no way to
// say "buy this, then sell it". So the export drops every absorbed component,
// and the page says so with this build's own count rather than an average --
// a player who imports 11 of 17 purchases should be told which six went.
function exportFile(b) {
  const slug = (b.archetype || b.hero).toLowerCase()
    .replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
  return { name: slug + ".json", text: JSON.stringify(b.export, null, 2) };
}

function downloadBuild(b) {
  const file = exportFile(b);
  const url = URL.createObjectURL(new Blob([file.text], { type: "application/json" }));
  const a = document.createElement("a");
  a.href = url;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  URL.revokeObjectURL(url);
}

function renderExport(b) {
  if (!b.export) return "";
  const absorbed = b.items.filter(i => i.sold);
  const note = absorbed.length
    ? "The file carries the " + (b.items.length - absorbed.length) +
      " items you still hold at the end. The other <b>" + absorbed.length +
      "</b> — " + absorbed.map(i => esc(i.name)).join(", ") +
      " — are components absorbed into later purchases, and the game&rsquo;s " +
      "build schema has no way to express a sale, so they are not in it. " +
      "Buy them anyway, in the order above."
    : "Every purchase in this build survives to the end, so the file is the " +
      "whole build.";
  return '<h3 class="section">Take it into the game</h3>' +
    '<p class="section-note">The same JSON <code>deadlock build --export</code> ' +
    "writes. Import it in Deadlock&rsquo;s own build browser.</p>" +
    '<div class="export">' +
      '<button class="btn" type="button" id="dl">Download build JSON</button>' +
      '<p class="lost">' + note + "</p>" +
    "</div>";
}

const stat = (value, label) =>
  '<div class="stat"><b>' + value + "</b><span>" + label + "</span></div>";

function renderRow(it) {
  const tags =
    (it.staple ? '<span class="tag staple">staple</span>' : "") +
    (it.sold ? '<span class="tag sold">absorbed ' + clock(it.sold) + "</span>" : "") +
    (it.n < 30 ? '<span class="tag thin">thin evidence</span>' : "");
  return '<div class="row' + (it.staple ? " staple" : "") + '">' +
    '<span class="clock">' + clock(it.time) + '</span><span class="dot"></span>' +
    '<div class="name">' + it.name + tags + "</div>" +
    '<div class="meta">p=' + it.p.toFixed(3) + " &middot; n=" + it.n.toLocaleString() +
      " &middot; " + it.level + "</div>" +
    '<div class="cost">' + it.cost.toLocaleString() +
      '<span class="bar" style="width:' + Math.max(8, Math.round(86 * it.cost / 6400)) + 'px"></span>' +
    "</div></div>";
}

// The masthead and the footer are written from the data rather than typed in,
// so a refit at another bracket cannot leave the page asserting figures that
// belong to a different run.
function renderMeta() {
  const purchases = BUILDS.reduce((s, b) => s + b.items.length, 0);
  const absorbed = BUILDS.reduce(
    (s, b) => s + b.items.filter(i => i.sold).length, 0);
  const facts = [
    [BUILDS.length, "builds"],
    [META.top1.toFixed(3), "top-1 &middot; bigram " + META.bigram.toFixed(3)],
    [META.players, "player-matches"],
  ];
  document.getElementById("facts").innerHTML = facts.map(
    f => '<div class="fact"><b>' + f[0] + "</b><span>" + f[1] + "</span></div>"
  ).join("");

  document.getElementById("footer").innerHTML =
    "Built by a backoff frequency model over " + META.purchases +
    " purchases, conditioned on hero and archetype, and weighted toward <strong>" +
    esc(META.bracket) + "</strong>. Buy times are population medians at each " +
    "position. An item marked <strong>absorbed</strong> is a component consumed " +
    "by a later composite: it frees its inventory slot, which is how a build of " +
    "more than twelve purchases fits in twelve slots — " +
    Math.round(100 * absorbed / purchases) + "% of the " + purchases +
    " purchases on this page are absorbed that way, and an exported build " +
    "cannot carry them. Every build here carries each item that at least 70% " +
    "of that archetype&rsquo;s players buy.";
}

document.getElementById("q").addEventListener("input", e => renderList(e.target.value));
renderMeta();
renderList("");
renderBuild();
</script>
