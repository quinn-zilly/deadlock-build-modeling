<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Visual direction — prototype</title>
<!--
  THROWAWAY PROTOTYPE. Answers issue #19: what should the build site look like?
  Three structurally different takes on one hero page, switchable via ?variant=
  and the bar at the bottom. Real Gun Ivy data, generated at badge 80.
  Not production code: no build step, no tests, data inlined by hand.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Sora:wght@300;400;500;600&display=swap">
<style>
:root{
  --ground:#14171A;
  --surface:#1B1F23;
  --raised:#232830;
  --edge:#2E343C;
  --edge-soft:#252A31;
  --oxblood:#7A2233;
  --oxblood-lit:#A63449;
  --brass:#C9973F;
  --brass-lit:#E3B663;
  --verdigris:#4E8C7D;
  --verdigris-lit:#6FB3A2;
  --text:#E9E2D4;
  --muted:#9C948456;
  --muted:#9C9484;
  --faint:#6E6759;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;font-weight:300;
  padding-bottom:96px;
  font-variant-numeric:tabular-nums;
}
h1,h2,h3{font-family:"Alegreya Sans SC",Sora,sans-serif;margin:0;line-height:1.05;font-weight:800}
a{color:var(--brass-lit)}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
.narrow{max-width:640px;margin:0 auto;padding:0 22px}
:focus-visible{outline:2px solid var(--brass-lit);outline-offset:2px}
button{font:inherit}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ── shared: the copy affordance ─────────────────────────────── */
.copy{
  display:inline-flex;align-items:baseline;gap:10px;cursor:pointer;
  background:var(--oxblood);color:#F6EFE2;border:0;
  padding:13px 20px;font-weight:500;font-size:14px;letter-spacing:.01em;
  text-align:left;
}
.copy:hover{background:var(--oxblood-lit)}
.copy small{color:#E0C7A8;font-weight:300;font-size:12px;white-space:nowrap}
@media(max-width:520px){
  .copy{width:100%;flex-direction:column;align-items:flex-start;gap:3px}
  .copy small{white-space:normal}
}

/* ══════════════════════════════════════════════════════════════
   VARIANT A — SHOP TICKET
   One narrow column. The build reads as a printed dock ticket:
   a running soul total down the right, phase bands as ruled
   breaks, nothing beside it competing for attention.
   ══════════════════════════════════════════════════════════════ */
.a-head{padding:56px 0 0}
.a-plate{
  border-top:3px solid var(--brass);border-bottom:1px solid var(--edge);
  padding:22px 0 20px;position:relative;
}
.a-plate h1{font-size:clamp(38px,9vw,58px);letter-spacing:.005em}
.a-plate .who{
  font-family:Sora;font-weight:300;font-size:14px;color:var(--muted);
  margin-top:10px;max-width:46ch;line-height:1.55;
}
.a-facts{display:flex;gap:26px;flex-wrap:wrap;padding:16px 0 0;font-size:13px;color:var(--muted)}
.a-facts b{color:var(--brass);font-weight:500}
.a-cta{padding:22px 0 30px}
.a-ticket{border-left:1px solid var(--edge);margin-left:4px}
.a-band{position:relative;padding:0 0 4px 26px}
.a-band>h3{
  font-size:19px;font-weight:700;color:var(--brass);letter-spacing:.03em;
  padding:26px 0 4px;
}
.a-band>h3 em{font-style:normal;color:var(--faint);font-family:Sora;font-weight:300;font-size:12px;margin-left:10px}
.a-band::before{
  content:"";position:absolute;left:-4px;top:32px;width:7px;height:7px;
  background:var(--brass);transform:rotate(45deg);
}
.a-buy{
  display:grid;grid-template-columns:1fr auto;gap:2px 16px;
  padding:11px 0;border-bottom:1px solid var(--edge-soft);align-items:baseline;
}
.a-buy:last-child{border-bottom:0}
.a-buy .nm{font-size:16px;font-weight:400}
.a-buy .nm b{font-weight:600;color:var(--brass-lit)}
.a-buy .why{grid-column:1;font-size:12px;color:var(--faint);letter-spacing:.01em}
.a-buy .sum{grid-row:1/3;grid-column:2;text-align:right;font-size:15px;color:var(--muted);font-weight:400}
.a-buy .sum s{display:block;font-size:11px;color:var(--faint);text-decoration:none;font-weight:300}
.a-buy.sold .nm{color:var(--muted)}
.a-note{
  border-left:2px solid var(--verdigris);padding:12px 0 12px 16px;margin:34px 0 0;
  font-size:13.5px;color:var(--muted);max-width:56ch;
}
.a-abil{margin:52px 0 0;border-top:1px solid var(--edge);padding-top:26px}
.a-abil h3{font-size:19px;color:var(--verdigris-lit);letter-spacing:.03em;margin-bottom:4px}
.a-pts{display:flex;flex-wrap:wrap;gap:7px;margin-top:16px}
.a-pt{
  display:flex;flex-direction:column;align-items:center;gap:3px;
  border:1px solid var(--edge);padding:8px 11px;min-width:58px;
}
.a-pt i{font-style:normal;font-size:11px;color:var(--faint)}
.a-pt b{font-weight:500;font-size:13px}
.a-pt.ent{border-color:var(--verdigris);color:var(--verdigris-lit)}

/* ══════════════════════════════════════════════════════════════
   VARIANT B — PHASE COLUMNS
   The four soul tiers as physical columns, scanned across rather
   than down. Answers "what am I buying this phase" at a glance;
   the shop itself is laid out in tiers, so the page mirrors it.
   ══════════════════════════════════════════════════════════════ */
.b-top{background:var(--surface);border-bottom:1px solid var(--edge)}
.b-inner{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px 40px;padding:44px 0 26px}
.b-inner h1{font-size:clamp(34px,6vw,50px)}
.b-inner .who{font-size:14px;color:var(--muted);margin-top:8px;max-width:44ch;font-weight:300}
.b-inner .right{margin-left:auto;display:flex;gap:28px;align-items:flex-end;flex-wrap:wrap}
.b-num{display:flex;flex-direction:column}
.b-num b{font-size:26px;color:var(--brass);font-weight:500;line-height:1.1}
.b-num span{font-size:12px;color:var(--faint)}
.b-cols{display:grid;grid-template-columns:repeat(3,1fr);gap:0;margin:34px 0 0}
.b-col{border-left:1px solid var(--edge);padding:0 18px 22px}
.b-col:first-child{border-left:0;padding-left:0}
.b-col h3{
  font-size:22px;color:var(--brass);padding:0 0 3px;letter-spacing:.02em;
}
.b-col .when{font-size:12px;color:var(--faint);padding-bottom:14px;border-bottom:2px solid var(--oxblood);margin-bottom:4px}
.b-item{padding:12px 0;border-bottom:1px solid var(--edge-soft)}
.b-item:last-child{border-bottom:0}
.b-item .nm{font-size:14.5px;font-weight:400;line-height:1.35}
.b-item .nm b{font-weight:600;color:var(--brass-lit)}
.b-item .why{font-size:11.5px;color:var(--faint);margin-top:3px}
.b-item.sold .nm{color:var(--muted)}
.b-cta{padding:30px 0 0;display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.b-cta p{margin:0;font-size:13px;color:var(--faint);max-width:40ch}
.b-abil{margin:46px 0 0;border-top:1px solid var(--edge);padding-top:24px}
.b-abil h3{font-size:20px;color:var(--verdigris-lit);margin-bottom:12px}
.b-track{display:flex;gap:6px;flex-wrap:wrap}
.b-tick{border:1px solid var(--edge);padding:7px 10px;font-size:12.5px;display:flex;gap:7px;align-items:baseline}
.b-tick i{font-style:normal;color:var(--faint);font-size:11px}
.b-tick.ent{border-color:var(--verdigris);color:var(--verdigris-lit)}
@media(max-width:820px){
  .b-cols{grid-template-columns:1fr}
  .b-col{border-left:0;border-top:1px solid var(--edge);padding:0 0 18px}
  .b-col:first-child{border-top:0}
  .b-col h3{padding-top:20px}
}

/* ══════════════════════════════════════════════════════════════
   VARIANT C — THE SPINE
   One clock down the middle. Items hang left, ability points
   hang right, both pinned to the minute they happen. The build
   IS the timeline, which is the claim the model actually makes.
   ══════════════════════════════════════════════════════════════ */
.c-head{padding:50px 0 0;display:flex;gap:24px 44px;flex-wrap:wrap;align-items:flex-end}
.c-head h1{font-size:clamp(36px,6.5vw,54px)}
.c-head .who{font-size:14px;color:var(--muted);margin-top:9px;max-width:42ch;font-weight:300}
.c-head .cta{margin-left:auto}
.c-rule{height:1px;background:var(--edge);margin:26px 0 0}
.c-legend{display:flex;gap:22px;flex-wrap:wrap;padding:14px 0 6px;font-size:12px;color:var(--faint)}
.c-legend i{font-style:normal;display:inline-flex;gap:7px;align-items:center}
.c-sw{width:9px;height:9px;flex:none;transform:rotate(45deg)}
.c-spine{position:relative;padding:20px 0 40px}
.c-spine::before{
  content:"";position:absolute;left:50%;top:0;bottom:0;width:1px;
  background:var(--edge);transform:translateX(-50%);
}
.c-ph{
  position:relative;text-align:center;padding:22px 0 10px;
}
.c-ph span{
  background:var(--ground);position:relative;padding:0 14px;
  font-family:"Alegreya Sans SC";font-weight:700;font-size:16px;
  color:var(--brass);letter-spacing:.05em;
}
.c-ev{position:relative;display:grid;grid-template-columns:1fr 96px 1fr;align-items:baseline;padding:7px 0}
.c-ev .clock{
  grid-column:2;text-align:center;font-size:12px;color:var(--faint);
  background:var(--ground);position:relative;z-index:1;padding:0 4px;
}
.c-ev .clock::before{
  content:"";position:absolute;top:6px;width:7px;height:7px;transform:rotate(45deg);
  background:var(--brass);
}
.c-ev.left .clock::before{right:-3.5px}
.c-ev.right .clock::before{left:-3.5px;background:var(--verdigris)}
.c-ev.dim .clock::before{background:var(--faint)}
.c-ev .box{padding:0 0 0 0}
.c-ev.left .box{grid-column:1;text-align:right;padding-right:18px}
.c-ev.right .box{grid-column:3;text-align:left;padding-left:18px}
.c-ev .nm{font-size:15px;font-weight:400}
.c-ev .nm b{font-weight:600;color:var(--brass-lit)}
.c-ev .why{font-size:11.5px;color:var(--faint);margin-top:1px}
.c-ev.sold .nm{color:var(--muted)}
.c-ev.abil .nm{color:var(--verdigris-lit);font-size:14px}
@media(max-width:760px){
  .c-spine::before{left:64px}
  .c-ev{grid-template-columns:64px 1fr;padding:9px 0}
  .c-ev .clock{grid-column:1;grid-row:1;text-align:left;padding-left:0}
  .c-ev.left .box,.c-ev.right .box{grid-column:2;grid-row:1;text-align:left;padding:0 0 0 20px}
  .c-ph{text-align:left;padding-left:0}
  .c-ph span{padding-left:0}
}

/* ── prototype switcher (not part of the design) ─────────────── */
.sw{
  position:fixed;left:50%;bottom:18px;transform:translateX(-50%);
  display:flex;align-items:center;gap:2px;z-index:99;
  background:#F2EDE2;color:#14171A;border-radius:999px;
  box-shadow:0 6px 26px rgba(0,0,0,.55);font-family:Sora,sans-serif;
  padding:4px;
}
.sw button{
  border:0;background:transparent;color:#14171A;cursor:pointer;
  padding:8px 13px;border-radius:999px;font-size:16px;line-height:1;
}
.sw button:hover{background:#DCD4C4}
.sw .lab{padding:0 12px;font-size:13px;font-weight:500;white-space:nowrap}
.sw .lab em{font-style:normal;color:#6E6759;font-weight:400}
</style>
</head>
<body>
<main id="app"></main>

<div class="sw" role="group" aria-label="Prototype variant switcher">
  <button id="prev" aria-label="Previous variant">←</button>
  <span class="lab" id="lab"></span>
  <button id="next" aria-label="Next variant">→</button>
</div>

<script>
// ── real Gun Ivy data, badge 80 ─────────────────────────────────
const B = {
  hero:"Ivy", archetype:"Gun Ivy",
  share:0.3327, win_rate:0.5126, n:2731, n_staples:4,
  items:[
    {name:"Extended Magazine",cost:800,time:70,p:.686,n:2670,staple:true,sold:191},
    {name:"Titanic Magazine",cost:1600,time:191,p:.534,n:1748,staple:true,sold:null},
    {name:"Tesla Bullets",cost:3200,time:304,p:.802,n:1135,staple:true,sold:950},
    {name:"Extra Charge",cost:800,time:420,p:.236,n:388,staple:false,sold:1318},
    {name:"Healbane",cost:1600,time:527,p:.652,n:19,staple:false,sold:null},
    {name:"Fleetfoot",cost:1600,time:629,p:.610,n:122,staple:false,sold:null},
    {name:"Quicksilver Reload",cost:1600,time:731,p:.571,n:595,staple:false,sold:1684},
    {name:"Spirit Lifesteal",cost:1600,time:838,p:.488,n:432,staple:false,sold:null},
    {name:"Capacitor",cost:6400,time:950,p:.664,n:806,staple:true,sold:null},
    {name:"Grit",cost:800,time:1065,p:.312,n:210,staple:false,sold:1194},
    {name:"Spirit Shielding",cost:1600,time:1194,p:.402,n:318,staple:false,sold:null},
    {name:"Rapid Recharge",cost:3200,time:1318,p:.455,n:287,staple:false,sold:null},
    {name:"Mystic Expansion",cost:800,time:1441,p:.398,n:694,staple:false,sold:null},
    {name:"Extra Spirit",cost:800,time:1570,p:.281,n:243,staple:false,sold:1910},
    {name:"Mercurial Magnum",cost:6400,time:1684,p:.612,n:434,staple:false,sold:null},
    {name:"Mystic Vulnerability",cost:1600,time:1795,p:.344,n:198,staple:false,sold:null},
    {name:"Improved Spirit",cost:1600,time:1910,p:.377,n:221,staple:false,sold:null}
  ],
  abilities:[
    {position:1,name:"Entangling Thorns",level:1,time:15,p:.492,n:2731},
    {position:2,name:"Stone Form",level:1,time:85,p:.573,n:1433},
    {position:3,name:"Stone Form",level:2,time:108,p:.900,n:1394},
    {position:4,name:"Kudzu Connection",level:1,time:201,p:.577,n:2462},
    {position:5,name:"Stone Form",level:3,time:258,p:.662,n:1035},
    {position:6,name:"Air Drop",level:1,time:349,p:.510,n:1511},
    {position:7,name:"Air Drop",level:2,time:389,p:.672,n:1446},
    {position:8,name:"Kudzu Connection",level:2,time:463,p:.905,n:1272},
    {position:9,name:"Kudzu Connection",level:3,time:555,p:.947,n:1495},
    {position:10,name:"Kudzu Connection",level:4,time:758,p:.497,n:2974},
    {position:11,name:"Air Drop",level:3,time:856,p:.356,n:2974},
    {position:12,name:"Air Drop",level:4,time:1051,p:.901,n:1088},
    {position:13,name:"Stone Form",level:4,time:1227,p:.377,n:1810},
    {position:14,name:"Entangling Thorns",level:2,time:1473,p:.849,n:421},
    {position:15,name:"Entangling Thorns",level:3,time:1825,p:.930,n:210},
    {position:16,name:"Entangling Thorns",level:4,time:2402,p:.732,n:378}
  ],
  imbue:[{item:"Quicksilver Reload",ability:"Entangling Thorns",share:.993,n:595},
         {item:"Mercurial Magnum",ability:"Entangling Thorns",share:.991,n:434},
         {item:"Mystic Expansion",ability:"Entangling Thorns",share:.582,n:694}]
};

// Phase bands, not per-item clocks: buy time is linear in buy index, so the
// page commits only to which phase a purchase lands in.
const PHASES = [
  {key:"Lane",   label:"Laning",     until:600,  when:"first 10 minutes"},
  {key:"Mid",    label:"Mid game",   until:1200, when:"10 – 20 min"},
  {key:"Late",   label:"Late game",  until:1800, when:"20 – 30 min"},
  {key:"Vlate",  label:"Very late",  until:1e9,  when:"30 min +"}
];
const phaseOf = t => PHASES.find(p => t < p.until);
const imbueFor = n => B.imbue.find(i => i.item === n);
const mmss = s => Math.floor(s/60)+":"+String(Math.round(s%60)).padStart(2,"0");
const souls = c => c.toLocaleString();
const esc = s => String(s).replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
const pct = x => Math.round(x*100)+"%";
// Buy index, not a running soul total: absorbed components do not stack, so a
// cumulative sum would claim a build costs 36,000 souls when it does not.
const buyIx = B.items.map((_,i) => i+1);

// The one line of copy every variant shares: what this build is and who it is from.
const WHO = `What the top third of Ivy players build when they play her as a gun carry. `
          + `${B.n.toLocaleString()} ranked matches, badge 80 and up.`;

// evidence line for one item
const ev = i => {
  const im = imbueFor(i.name);
  const bits = [`${pct(i.p)} of them buy it`];
  if (i.n < 30) bits.push(`thin: ${i.n} matches`);
  if (im) bits.push(`imbue ${im.ability}`);
  if (i.sold) bits.push(`absorbed ${phaseOf(i.sold).label.toLowerCase()}`);
  return bits.join(" · ");
};

// ── VARIANT A : Shop Ticket ─────────────────────────────────────
function variantA(){
  let out = `<div class="narrow"><div class="a-head"><div class="a-plate">
    <h1>${esc(B.archetype)}</h1>
    <p class="who">${esc(WHO)}</p>
  </div>
  <div class="a-facts">
    <span>Played by <b>${pct(B.share)}</b> of Ivy players</span>
    <span>Wins <b>${pct(B.win_rate)}</b></span>
    <span><b>${B.n_staples}</b> items nearly all of them buy</span>
  </div>
  <div class="a-cta">
    <button class="copy">Copy build order <small>paste beside the build browser</small></button>
  </div>
  <div class="a-ticket">`;

  let last = null;
  B.items.forEach((i,ix) => {
    const ph = phaseOf(i.time);
    if (ph.key !== last){
      if (last !== null) out += `</div>`;
      out += `<div class="a-band"><h3>${esc(ph.label)} <em>${esc(ph.when)}</em></h3>`;
      last = ph.key;
    }
    out += `<div class="a-buy${i.sold?" sold":""}">
      <div class="nm">${i.staple?"<b>":""}${esc(i.name)}${i.staple?"</b>":""}</div>
      <div class="why">${esc(ev(i))}</div>
      <div class="sum">${souls(i.cost)}<s>buy ${buyIx[ix]} of ${B.items.length}</s></div>
    </div>`;
  });
  out += `</div></div>
  <p class="a-note">Items that fade are absorbed into something you buy later — the slot
  comes back. Ivy players buy 17 things and hold 12.</p>

  <div class="a-abil">
    <h3>Where the points go</h3>
    <p class="who" style="margin:6px 0 0">Thorns first, then Stone Form to survive the lane. Everything
    that follows is Kudzu and Air Drop, in that order.</p>
    <div class="a-pts">`;
  B.abilities.forEach(a => {
    out += `<div class="a-pt${a.name==="Entangling Thorns"?" ent":""}">
      <i>${a.position}</i><b>${esc(a.name.split(" ")[0])}</b><i>${a.level}</i></div>`;
  });
  out += `</div></div></div>`;
  return out;
}

// ── VARIANT B : Phase Columns ───────────────────────────────────
function variantB(){
  // Three columns, not four: the phases are 5/7/5/1, so a "very late" column of
  // its own is mostly dead space. Late and very late share one.
  const COLS = [
    {label:"Laning",   when:"first 10 minutes", keys:["Lane"]},
    {label:"Mid game", when:"10 – 20 min",      keys:["Mid"]},
    {label:"Late game",when:"20 min onward",    keys:["Late","Vlate"]}
  ];
  const groups = COLS.map(c => ({p:c, items:B.items.filter(i => c.keys.includes(phaseOf(i.time).key))}))
                     .filter(g => g.items.length);
  let out = `<div class="b-top"><div class="wrap"><div class="b-inner">
    <div>
      <h1>${esc(B.archetype)}</h1>
      <p class="who">${esc(WHO)}</p>
    </div>
    <div class="right">
      <div class="b-num"><b>${pct(B.share)}</b><span>of Ivy players</span></div>
      <div class="b-num"><b>${pct(B.win_rate)}</b><span>win rate</span></div>
      <div class="b-num"><b>${B.items.length}</b><span>purchases</span></div>
    </div>
  </div></div></div>
  <div class="wrap"><div class="b-cols">`;

  groups.forEach(g => {
    out += `<div class="b-col"><h3>${esc(g.p.label)}</h3><div class="when">${esc(g.p.when)}</div>`;
    g.items.forEach(i => {
      out += `<div class="b-item${i.sold?" sold":""}">
        <div class="nm">${i.staple?"<b>":""}${esc(i.name)}${i.staple?"</b>":""}
          <span style="color:var(--faint);font-weight:300"> ${souls(i.cost)}</span></div>
        <div class="why">${esc(ev(i))}</div>
      </div>`;
    });
    out += `</div>`;
  });

  out += `</div>
  <div class="b-cta">
    <button class="copy">Copy build order <small>paste beside the build browser</small></button>
    <p>Order within a phase is the order these players bought in. Faded items get
    absorbed into a later purchase.</p>
  </div>
  <div class="b-abil"><h3>Where the points go</h3><div class="b-track">`;
  B.abilities.forEach(a => {
    out += `<div class="b-tick${a.name==="Entangling Thorns"?" ent":""}">
      <i>${a.position}</i>${esc(a.name)} <i>${a.level}</i></div>`;
  });
  out += `</div></div></div>`;
  return out;
}

// ── VARIANT C : The Spine ───────────────────────────────────────
function variantC(){
  const events = [
    ...B.items.map(i => ({t:i.time, kind:"item", d:i})),
    ...B.abilities.map(a => ({t:a.time, kind:"abil", d:a}))
  ].sort((x,y) => x.t - y.t);

  let out = `<div class="wrap"><div class="c-head">
    <div>
      <h1>${esc(B.archetype)}</h1>
      <p class="who">${esc(WHO)}</p>
    </div>
    <div class="cta"><button class="copy">Copy build order <small>paste beside the build browser</small></button></div>
  </div>
  <div class="c-rule"></div>
  <div class="c-legend">
    <i><span class="c-sw" style="background:var(--brass)"></span>Buy this</i>
    <i><span class="c-sw" style="background:var(--faint)"></span>Absorbed later</i>
    <i><span class="c-sw" style="background:var(--verdigris)"></span>Ability point</i>
    <i>Played by ${pct(B.share)} of Ivy players · wins ${pct(B.win_rate)}</i>
  </div>
  <div class="c-spine">`;

  // Buy index and point number, not clock times: the model orders events, and
  // buy time is linear in buy index, so a timestamp would overstate it.
  let last = null, nBuy = 0;
  events.forEach(e => {
    const ph = phaseOf(e.t);
    if (ph.key !== last){
      out += `<div class="c-ph"><span>${esc(ph.label)}</span></div>`;
      last = ph.key;
    }
    if (e.kind === "item"){
      const i = e.d; nBuy++;
      out += `<div class="c-ev left${i.sold?" sold dim":""}">
        <div class="box">
          <div class="nm">${i.staple?"<b>":""}${esc(i.name)}${i.staple?"</b>":""}</div>
          <div class="why">${souls(i.cost)} · ${esc(ev(i))}</div>
        </div>
        <div class="clock">buy ${nBuy}</div>
      </div>`;
    } else {
      const a = e.d;
      out += `<div class="c-ev right abil">
        <div class="clock">pt ${a.position}</div>
        <div class="box">
          <div class="nm">${esc(a.name)} → ${a.level}</div>
          <div class="why">${pct(a.p)} of them take it here</div>
        </div>
      </div>`;
    }
  });
  out += `</div></div>`;
  return out;
}

// ── switcher ────────────────────────────────────────────────────
const VARIANTS = [
  ["A","Shop ticket", variantA],
  ["B","Phase columns", variantB],
  ["C","The spine", variantC]
];
function current(){
  const k = (new URLSearchParams(location.search).get("variant")||"A").toUpperCase();
  const ix = VARIANTS.findIndex(v => v[0]===k);
  return ix < 0 ? 0 : ix;
}
function render(){
  const ix = current();
  document.getElementById("app").innerHTML = VARIANTS[ix][2]();
  document.getElementById("lab").innerHTML = VARIANTS[ix][0]+" <em>"+esc(VARIANTS[ix][1])+"</em>";
  document.title = VARIANTS[ix][1]+" — visual direction";
  document.querySelectorAll(".copy").forEach(b => b.addEventListener("click", () => {
    const txt = B.items.map((i,n) => `${n+1}. ${i.name} (${souls(i.cost)})`).join("\n");
    navigator.clipboard?.writeText(txt);
    b.firstChild.nodeValue = "Copied ";
    setTimeout(() => b.firstChild.nodeValue = "Copy build order ", 1400);
  }));
}
function go(step){
  const ix = (current()+step+VARIANTS.length) % VARIANTS.length;
  const u = new URL(location); u.searchParams.set("variant", VARIANTS[ix][0]);
  history.replaceState({}, "", u); render();
}
document.getElementById("prev").onclick = () => go(-1);
document.getElementById("next").onclick = () => go(1);
addEventListener("keydown", e => {
  if (/^(INPUT|TEXTAREA)$/.test(e.target.tagName) || e.target.isContentEditable) return;
  if (e.key === "ArrowLeft") go(-1);
  if (e.key === "ArrowRight") go(1);
});
render();
</script>
