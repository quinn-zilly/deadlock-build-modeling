<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gun Ivy — variant B</title>
<!--
  THROWAWAY PROTOTYPE. The chosen direction (variant B) from issue #19, with the
  six changes asked for on the ticket:
    1. item icons, with a hover tooltip carrying the name and what it does
    2. hero portrait beside the build name
    3. "builds into X" replaces "absorbed"
    4. a bare percentage per item, explained once in a footnote
    5. ability order laid out the way the in-game build browser lays it out
    6. B's palette and column layout
  Real Gun Ivy data at badge 80. Icons and portrait are inlined as data URIs so
  this opens from a file path. Not production code.
-->
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans+SC:wght@500;700;800&family=Sora:wght@300;400;500;600&display=swap">
<style>
:root{
  --ground:#14171A; --surface:#1B1F23; --raised:#232830;
  --edge:#2E343C; --edge-soft:#252A31;
  --oxblood:#7A2233; --oxblood-lit:#A63449;
  --brass:#C9973F; --brass-lit:#E3B663;
  --verdigris:#4E8C7D; --verdigris-lit:#6FB3A2;
  --text:#E9E2D4; --muted:#9C9484; --faint:#6E6759;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--ground);color:var(--text);
  font-family:Sora,system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15px;line-height:1.6;font-weight:300;
  font-variant-numeric:tabular-nums;padding-bottom:70px;
}
h1,h2,h3{font-family:"Alegreya Sans SC",Sora,sans-serif;margin:0;line-height:1.05;font-weight:800}
.wrap{max-width:1120px;margin:0 auto;padding:0 22px}
:focus-visible{outline:2px solid var(--brass-lit);outline-offset:2px}
button{font:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ── masthead: portrait beside the build name (change 2) ─────── */
.top{background:var(--surface);border-bottom:1px solid var(--edge)}
.inner{display:flex;flex-wrap:wrap;align-items:flex-end;gap:20px 34px;padding:34px 0 24px}
.ident{display:flex;align-items:center;gap:20px;min-width:0}
.portrait{
  width:92px;height:92px;flex:none;border-radius:2px;object-fit:cover;
  border:1px solid var(--edge);background:var(--raised);
  /* the card art is a bust on a transparent ground; sit it on the panel */
  object-position:center top;
}
.ident h1{font-size:clamp(32px,5.4vw,48px)}
.ident .who{font-size:13.5px;color:var(--muted);margin-top:7px;max-width:44ch;font-weight:300}
.right{margin-left:auto;display:flex;gap:26px;align-items:flex-end;flex-wrap:wrap}
.num{display:flex;flex-direction:column}
.num b{font-size:25px;color:var(--brass);font-weight:500;line-height:1.1}
.num span{font-size:12px;color:var(--faint)}

/* ── phase columns ───────────────────────────────────────────── */
.cols{display:grid;grid-template-columns:repeat(3,1fr);margin:30px 0 0}
.col{border-left:1px solid var(--edge);padding:0 18px 20px}
.col:first-child{border-left:0;padding-left:0}
.col h3{font-size:21px;color:var(--brass);padding:0 0 3px;letter-spacing:.02em}
.col .when{font-size:12px;color:var(--faint);padding-bottom:12px;border-bottom:2px solid var(--oxblood)}

/* ── one purchase: icon, name, percentage (changes 1 and 4) ──── */
.buy{display:grid;grid-template-columns:40px 1fr auto;gap:2px 12px;
  padding:11px 0;border-bottom:1px solid var(--edge-soft);align-items:center}
.buy:last-child{border-bottom:0}
.ico{
  grid-row:1/3;width:40px;height:40px;border:1px solid var(--edge);
  background:var(--raised);object-fit:contain;padding:2px;cursor:help;
}
.buy.staple .ico{border-color:var(--brass)}
.nm{font-size:14.5px;font-weight:400;line-height:1.3;cursor:help}
.buy.staple .nm{font-weight:600;color:var(--brass-lit)}
.sub{grid-column:2;font-size:11.5px;color:var(--faint)}
.sub .into{color:var(--verdigris-lit)}
.pc{grid-row:1/3;grid-column:3;font-size:14px;color:var(--muted);text-align:right}
.cost{color:var(--faint);font-weight:300}

/* ── tooltip (change 1) ──────────────────────────────────────── */
#tip{
  position:fixed;z-index:60;max-width:330px;pointer-events:none;
  background:#0F1215;border:1px solid var(--edge);border-left:3px solid var(--brass);
  padding:12px 14px;font-size:13px;line-height:1.5;color:var(--text);
  box-shadow:0 10px 34px rgba(0,0,0,.6);
}
#tip[hidden]{display:none}
#tip h4{font-family:"Alegreya Sans SC";font-size:17px;font-weight:700;margin:0 0 2px;color:var(--brass-lit)}
#tip .tcost{font-size:12px;color:var(--faint);margin-bottom:8px}
#tip .prose{color:var(--muted)}
/* the game's own emphasis classes, mapped to this palette */
#tip .highlight{color:var(--text);font-weight:400}
#tip .diminish{color:var(--faint)}
#tip svg{width:1em;height:1em;vertical-align:-.12em;fill:currentColor}
#tip img{width:1em;height:1em;vertical-align:-.12em}
#tip .stats{margin-top:9px;border-top:1px solid var(--edge-soft);padding-top:8px;
  display:grid;grid-template-columns:1fr auto;gap:2px 14px;font-size:12.5px}
#tip .stats i{font-style:normal;color:var(--faint)}
#tip .stats b{font-weight:500;color:var(--brass)}

/* ── ability order, laid out like the in-game build browser (5) ─
   One row per ability, its own art at the left, and a marker at each
   position where a point goes in. The number on a marker is what that
   upgrade costs in ability points -- 1, 2 then 5 -- which is what the
   game shows, not the resulting level. The first, unnumbered marker is
   the unlock.                                                           */
.abil{margin:40px 0 0;border-top:1px solid var(--edge);padding-top:22px}
.abil h3{font-size:20px;color:var(--verdigris-lit);margin-bottom:4px}
.abil .lede{font-size:13px;color:var(--muted);margin:0 0 16px;max-width:64ch}
.track{background:var(--surface);border:1px solid var(--edge);padding:0;overflow-x:auto}
.trow{display:grid;grid-template-columns:52px 1fr;align-items:stretch;
  border-bottom:1px solid var(--edge-soft)}
.trow:last-child{border-bottom:0}
.trow img{width:52px;height:52px;object-fit:cover;background:var(--raised);
  border-right:1px solid var(--edge-soft)}
.lane{position:relative;min-width:620px;min-height:52px}
.mark{
  position:absolute;top:50%;transform:translate(-50%,-50%);
  display:flex;align-items:center;gap:5px;
  background:var(--raised);border:1px solid var(--edge);border-radius:999px;
  padding:3px 9px 3px 5px;white-space:nowrap;
}
.mark i{
  font-style:normal;width:9px;height:9px;flex:none;
  background:var(--verdigris-lit);transform:rotate(45deg);
}
.mark b{font-size:11.5px;font-weight:500;color:var(--muted)}
.mark.unlock{padding:3px 6px}
.mark.unlock i{background:var(--brass-lit)}

/* ── footnote (change 4) ─────────────────────────────────────── */
.notes{margin:34px 0 0;border-top:1px solid var(--edge);padding-top:16px;
  display:grid;gap:7px;font-size:12.5px;color:var(--faint);max-width:78ch}
.notes b{color:var(--muted);font-weight:400}
.cta{padding:26px 0 0;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.copy{display:inline-flex;align-items:baseline;gap:10px;cursor:pointer;
  background:var(--oxblood);color:#F6EFE2;border:0;padding:13px 20px;
  font-weight:500;font-size:14px}
.copy:hover{background:var(--oxblood-lit)}
.copy small{color:#E0C7A8;font-weight:300;font-size:12px}

@media(max-width:820px){
  .cols{grid-template-columns:1fr}
  .col{border-left:0;border-top:1px solid var(--edge);padding:0 0 16px}
  .col:first-child{border-top:0}
  .col h3{padding-top:18px}
  .portrait{width:64px;height:64px}
  .right{margin-left:0;gap:22px}
}
</style>
</head>
<body>
<div class="top"><div class="wrap"><div class="inner">
  <div class="ident">
    <img class="portrait" id="portrait" alt="Ivy">
    <div>
      <h1 id="title"></h1>
      <p class="who" id="who"></p>
    </div>
  </div>
  <div class="right" id="facts"></div>
</div></div></div>

<div class="wrap">
  <div class="cols" id="cols"></div>

  <div class="cta">
    <button class="copy" id="copy">Copy build order <small>paste beside the build browser</small></button>
  </div>

  <div class="abil">
    <h3>Ability order</h3>
    <p class="lede" id="abillede"></p>
    <div class="track" id="track"></div>
  </div>

  <div class="notes" id="notes"></div>
</div>

<div id="tip" hidden></div>

<script id="data" type="application/json">__DATA__</script>
<script>
const D = JSON.parse(document.getElementById("data").textContent);
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const pct = x => Math.round(x*100)+"%";
const souls = c => c.toLocaleString();

// The prose is third-party HTML from the assets API. Zero script tags and zero
// event handlers exist in today's catalogue, but that is a measurement, not a
// guarantee, so render it under an allowlist rather than injecting it raw.
const OK_TAGS = new Set(["SPAN","BR","SVG","PATH","G","DEFS","CLIPPATH","RECT","B","I","EM","STRONG"]);
const OK_ATTR = new Set(["class","style","d","fill","fill-rule","clip-rule","width","height",
                         "viewbox","xmlns","clip-path","id","transform","alt"]);
function clean(html){
  const doc = new DOMParser().parseFromString("<div>"+html+"</div>", "text/html");
  (function walk(node){
    for (const child of [...node.children]){
      if (!OK_TAGS.has(child.tagName.toUpperCase())){ child.remove(); continue; }
      for (const a of [...child.attributes]){
        if (!OK_ATTR.has(a.name.toLowerCase())) child.removeAttribute(a.name);
        if (a.name.toLowerCase()==="style" && /url|expression|@import/i.test(a.value))
          child.removeAttribute("style");
      }
      walk(child);
    }
  })(doc.body.firstChild);
  return doc.body.firstChild.innerHTML;
}

// masthead
document.getElementById("portrait").src = D.portrait;
document.getElementById("title").textContent = D.archetype;
document.getElementById("who").textContent =
  `What the top third of Ivy players build when they play her as a gun carry. `
  + `${D.n.toLocaleString()} ranked matches, badge 80 and up.`;
document.getElementById("facts").innerHTML = [
  [pct(D.share), "of Ivy players"],
  [pct(D.win_rate), "win rate"],
  [D.items.length, "purchases"]
].map(([b,s]) => `<div class="num"><b>${esc(b)}</b><span>${esc(s)}</span></div>`).join("");

// phase columns
const PH = [["Laning","first 10 minutes"],["Mid game","10 – 20 min"],["Late game","20 min onward"]];
document.getElementById("cols").innerHTML = PH.map(([label,when]) => {
  const rows = D.items.filter(i => i.phase === label);
  return `<div class="col"><h3>${esc(label)}</h3><div class="when">${esc(when)}</div>`
    + rows.map((i,ix) => `
      <div class="buy${i.staple?" staple":""}" data-item="${esc(label)}:${ix}">
        <img class="ico" src="${i.icon}" alt="" loading="lazy">
        <div class="nm">${esc(i.name)}</div>
        <div class="sub"><span class="cost">${souls(i.cost)}</span>${
          i.into ? ` · <span class="into">builds into ${esc(i.into)}</span>` : ""}</div>
        <div class="pc">${pct(i.p)}</div>
      </div>`).join("")
    + `</div>`;
}).join("");

// tooltip
const tip = document.getElementById("tip");
const byKey = {};
PH.forEach(([label]) => D.items.filter(i => i.phase===label).forEach((i,ix) => byKey[label+":"+ix]=i));
function showTip(i, x, y){
  const stats = (i.stats||[]).map(s => {
    const m = String(s).match(/^(.*)\s([\-+]?[\d.]+%?)$/);
    return m ? `<i>${esc(m[1])}</i><b>${esc(m[2])}</b>` : `<i>${esc(s)}</i><b></b>`;
  }).join("");
  const prose = [i.desc, i.active, i.passive].filter(Boolean).map(clean).join("<br>");
  tip.innerHTML = `<h4>${esc(i.name)}</h4>`
    + `<div class="tcost">${souls(i.cost)} souls${i.into?` · builds into ${esc(i.into)}`:""}</div>`
    + (prose ? `<div class="prose">${prose}</div>` : "")
    + (stats ? `<div class="stats">${stats}</div>` : "");
  tip.hidden = false;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(x+16, innerWidth - r.width - 12) + "px";
  tip.style.top  = Math.min(y+16, innerHeight - r.height - 12) + "px";
}
document.getElementById("cols").addEventListener("mouseover", e => {
  const row = e.target.closest(".buy"); if (!row) return;
  showTip(byKey[row.dataset.item], e.clientX, e.clientY);
});
document.getElementById("cols").addEventListener("mousemove", e => {
  const row = e.target.closest(".buy"); if (!row || tip.hidden) return;
  const r = tip.getBoundingClientRect();
  tip.style.left = Math.min(e.clientX+16, innerWidth - r.width - 12) + "px";
  tip.style.top  = Math.min(e.clientY+16, innerHeight - r.height - 12) + "px";
});
document.getElementById("cols").addEventListener("mouseout", e => {
  if (!e.relatedTarget || !e.relatedTarget.closest(".buy")) tip.hidden = true;
});

// Ability order the way the in-game build browser draws it: one row per
// ability with its own art, and a marker wherever a point goes in, placed
// along a continuous track rather than in a column grid. The number is the
// ability-point cost of that upgrade (1, 2, 5); the first marker is the
// unlock and carries no number.
const N = D.abilities.length;
document.getElementById("track").innerHTML = D.ability_art.map(art => {
  const marks = D.abilities
    .map((a,i) => ({...a, at:i}))
    .filter(a => a.name === art.name)
    .map(a => {
      const cost = D.ap_cost[String(a.level)];
      const left = ((a.at + 0.5) / N) * 100;
      return `<div class="mark${cost?"":" unlock"}" style="left:${left.toFixed(2)}%"
                   title="${esc(art.name)} — point ${a.at+1} of ${N}">
                <i></i>${cost ? `<b>${cost}</b>` : ""}
              </div>`;
    }).join("");
  return `<div class="trow"><img src="${art.icon}" alt="${esc(art.name)}"><div class="lane">${marks}</div></div>`;
}).join("");
document.getElementById("abillede").textContent =
  "Read left to right, in the order these players spent their points. The number on a "
  + "marker is what that upgrade costs in ability points; the first marker on a row is the unlock.";

// footnote: says once what the percentage means
document.getElementById("notes").innerHTML = [
  `<b>The percentage</b> beside an item is how often players of this archetype buy it — `
  + `not a win rate, and not a claim that the item causes wins.`,
  `<b>“Builds into”</b> means the item is a component that gets absorbed into a later `
  + `purchase, freeing its slot. Ivy players make ${D.items.length} purchases and hold 12.`,
  `Order within a phase is the order these players bought in. Timing is shown as phases `
  + `because buy time tracks buy order, so a per-item clock would claim more than the model knows.`
].map(t => `<div>${t}</div>`).join("");

document.getElementById("copy").addEventListener("click", e => {
  const txt = D.items.map((i,n) => `${n+1}. ${i.name} (${souls(i.cost)})`).join("\n");
  navigator.clipboard?.writeText(txt);
  const b = e.currentTarget;
  b.firstChild.nodeValue = "Copied ";
  setTimeout(() => b.firstChild.nodeValue = "Copy build order ", 1400);
});
</script>
</body>
</html>
