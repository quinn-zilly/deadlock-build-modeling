[project]
name = "deadlock-build-modeling"
version = "0.1.0"
description = "Build order and purchase timing modeling for Deadlock"
requires-python = ">=3.12"
dependencies = [
    "pandas>=2.2",
    "numpy>=1.26",
    "scikit-learn>=1.5",
    "pyarrow>=16",
    "scipy>=1.13",
    "requests>=2.32",
    "tqdm>=4.66",
]

[project.scripts]
deadlock = "deadlock.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8", "matplotlib>=3.8", "seaborn>=0.13", "ipykernel>=6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/deadlock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "data: needs data/processed/*.parquet; skipped when absent",
]

